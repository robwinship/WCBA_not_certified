name: OBA Data Scraper

on:
  schedule:
    # Coach data: daily at 8 AM Eastern (12:00 UTC)
    - cron: '0 12 * * *'
    # Executive data: monthly on the 1st at 8 AM Eastern (12:00 UTC)
    - cron: '0 12 1 * *'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
      
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      
      - name: Run coach scraper
        run: python scraper.py

      - name: Run executive scraper (monthly)
        if: github.event.schedule == '0 12 1 * *' || github.event_name == 'workflow_dispatch'
        run: python executive_scraper.py

      - name: Commit and push changes
        run: |
          git config --local user.email "robwinship@hotmail.com"
          git config --local user.name "robwinship"

          CHANGED=$(git diff --name-only data.json executives.json)
          if [ -z "$CHANGED" ]; then
            echo "No changes to commit"
          else
            git add data.json executives.json
            git commit -m "chore: update data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
